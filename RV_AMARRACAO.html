<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#183b59"><title>RV_AMARRACAO</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f6;font-family:Arial,sans-serif;color:#17212b}main{max-width:520px;min-height:100vh;margin:auto;background:#fff;padding:22px 18px}h1{text-align:center;color:#183b59;margin:8px 0 4px}.sub{text-align:center;color:#687985;margin:0 0 22px}label{display:block;font-weight:bold;margin:15px 0 7px}input,select,button{display:block;width:100%;min-height:50px;border-radius:10px;padding:12px;font-size:17px}input,select{border:1px solid #cbd7e0;background:#fff;color:#17212b}button{border:0;background:#183b59;color:#fff;font-weight:bold;margin-top:12px}.msg{padding:12px;border-radius:10px;margin-top:12px;text-align:center}.ok{background:#e8f7ef;color:#12633b}.error{background:#fff0f0;color:#991b1b}.hide{display:none}.head{background:#eaf2f8;padding:14px;border-radius:12px;margin-top:18px}.head h2{margin:0;color:#183b59}.tabs{display:table;width:100%;border-spacing:7px;margin-top:8px}.tabs button{display:table-cell;width:50%;font-size:14px}.inactive{background:#dfe8ef;color:#183b59}.card{border-bottom:1px solid #edf1f4;padding:14px 2px}.row{display:table;width:100%;padding:6px 0}.left,.right{display:table-cell}.right{text-align:right;font-weight:bold;color:#183b59}.calc{color:#687985;font-size:13px}.total{background:#14804a;color:#fff;text-align:center;padding:17px;border-radius:12px;margin-top:16px}.total b{display:block;font-size:30px;margin-top:4px}.day{border:1px solid #d7e0e7;border-radius:12px;padding:13px;margin-top:10px}.day h3{margin:0 0 8px;color:#183b59}.dayline{display:table;width:100%;padding:5px 0}.dayline span,.dayline b{display:table-cell}.dayline b{text-align:right}.daytotal{border-top:1px solid #d7e0e7;margin-top:6px;padding-top:9px;font-weight:bold;color:#14804a}</style></head><body><main><h1>RV Amarração</h1><p class="sub">Consulte sua remuneração variável</p><label for="code">Código de acesso</label><input id="code" type="tel" maxlength="5" inputmode="numeric" pattern="[0-9]*" placeholder="Digite os 5 números" oninput="onlyNumbers()"><button type="button" onclick="confirmCode();return false;">Confirmar código</button><div id="codemsg"></div><label for="month">Mês da RV</label><select id="month" disabled><option value="">Confirme o código primeiro</option></select><button id="consult" type="button" disabled onclick="showRV();return false;">Consultar RV</button><div id="msg"></div><div id="result" class="hide"></div></main><script type="text/javascript">var DATA={"04046":{"name":"Victor","months":{"2026-09":14,"2026-10":8},"days":{"2026-09-22":5,"2026-09-23":2,"2026-09-28":3,"2026-09-29":1,"2026-09-30":3,"2026-10-01":2,"2026-10-02":1,"2026-10-14":1,"2026-10-23":2,"2026-10-26":2}},"03583":{"name":"Adson","months":{"2026-09":47,"2026-10":40},"days":{"2026-09-22":11,"2026-09-23":4,"2026-09-24":4,"2026-09-25":6,"2026-09-28":3,"2026-09-30":12,"2026-09-29":7,"2026-10-01":3,"2026-10-02":1,"2026-10-06":1,"2026-10-08":7,"2026-10-09":4,"2026-10-14":5,"2026-10-21":2,"2026-10-16":4,"2026-10-15":1,"2026-10-22":2,"2026-10-23":2,"2026-10-26":2,"2026-10-27":4,"2026-10-31":2}},"05160":{"name":"Valdeir","months":{"2026-09":33,"2026-10":32},"days":{"2026-09-22":6,"2026-09-23":2,"2026-09-24":4,"2026-09-25":6,"2026-09-30":9,"2026-09-29":6,"2026-10-06":1,"2026-10-08":7,"2026-10-01":1,"2026-10-09":4,"2026-10-14":4,"2026-10-21":2,"2026-10-16":4,"2026-10-15":1,"2026-10-22":2,"2026-10-27":4,"2026-10-31":2}},"02699":{"name":"Rodrigo","months":{"2026-10":2},"days":{"2026-10-05":2}},"07178":{"name":"Guibson","months":{"2026-10":2},"days":{"2026-10-05":2}}};var UNIT=3.50;var ACTIVE=null;function el(id){return document.getElementById(id)}function onlyNumbers(){el('code').value=el('code').value.replace(/[^0-9]/g,'').substring(0,5);el('codemsg').innerHTML='';el('month').disabled=true;el('consult').disabled=true;ACTIVE=null}function brl(v){return 'R$ '+v.toFixed(2).replace('.',',')}function monthName(k){var a=k.split('-'),n=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];return n[parseInt(a[1],10)-1]+' de '+a[0]}function confirmCode(){var c=el('code').value;if(c.length!==5){el('codemsg').innerHTML='<div class="msg error">Digite exatamente 5 números.</div>';return false}if(!DATA[c]){el('codemsg').innerHTML='<div class="msg error">Código não localizado.</div>';return false}ACTIVE=DATA[c];var s=el('month'),keys=[],k;for(k in ACTIVE.months)if(ACTIVE.months.hasOwnProperty(k))keys.push(k);keys.sort().reverse();s.innerHTML='<option value="">Selecione o mês</option>';for(var i=0;i<keys.length;i++){var o=document.createElement('option');o.value=keys[i];o.appendChild(document.createTextNode(monthName(keys[i])));s.appendChild(o)}s.disabled=false;el('consult').disabled=false;el('codemsg').innerHTML='<div class="msg ok">Código confirmado. Selecione o mês.</div>';return false}function showRV(){var k=el('month').value;if(!ACTIVE||!k){el('msg').innerHTML='<div class="msg error">Selecione o mês da RV.</div>';return false}var cars=ACTIVE.months[k]||0,total=cars*UNIT,dayKeys=[],d;for(d in ACTIVE.days)if(ACTIVE.days.hasOwnProperty(d)&&d.indexOf(k)===0)dayKeys.push(d);dayKeys.sort();var days='';for(var i=0;i<dayKeys.length;i++){d=dayKeys[i];var q=ACTIVE.days[d],p=d.split('-');days+='<div class="day"><h3>'+p[2]+'/'+p[1]+'/'+p[0]+'</h3><div class="dayline"><span>Carros amarrados</span><b>'+q+'</b></div><div class="dayline"><span>'+q+' x '+brl(UNIT)+'</span><b>'+brl(q*UNIT)+'</b></div><div class="dayline daytotal"><span>Total do dia</span><b>'+brl(q*UNIT)+'</b></div></div>'}el('result').innerHTML='<div class="head"><h2>'+ACTIVE.name+'</h2><div>'+monthName(k)+'</div></div><div class="tabs"><button id="bm" type="button" onclick="tab(1)">Total do mês</button><button id="bd" class="inactive" type="button" onclick="tab(2)">Dia a dia</button></div><div id="monthly"><div class="card"><div class="row"><div class="left"><b>Carros amarrados</b></div><div class="right">'+cars+'</div></div><div class="row calc"><div class="left">'+cars+' x '+brl(UNIT)+'</div><div class="right">'+brl(total)+'</div></div></div><div class="total">Total da RV<b>'+brl(total)+'</b></div></div><div id="daily" class="hide">'+days+'</div>';el('result').className='';el('msg').innerHTML='';return false}function tab(n){el('monthly').className=n===1?'':'hide';el('daily').className=n===2?'':'hide';el('bm').className=n===1?'':'inactive';el('bd').className=n===2?'':'inactive'}</script></body></html>
